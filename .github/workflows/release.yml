name: Release macOS + iOS + Android + Linux

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  FLUTTER_VERSION: '3.44.0'

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build macOS app
        run: flutter build macos --release

      - name: Package app
        run: |
          APP_PATH="build/macos/Build/Products/Release/Coppelia.app"
          ZIP_PATH="Coppelia-macos.zip"
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" "$ZIP_PATH"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Coppelia-macos
          path: Coppelia-macos.zip

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: Coppelia-macos.zip

  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build iOS app (Simulator)
        run: flutter build ios --simulator --no-codesign

      - name: Package app
        run: |
          APP_PATH="build/ios/iphonesimulator/Runner.app"
          ZIP_PATH="Coppelia-ios-simulator.zip"
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" "$ZIP_PATH"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Coppelia-ios-simulator
          path: Coppelia-ios-simulator.zip

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: Coppelia-ios-simulator.zip

  build-android:
    runs-on: ubuntu-latest
    env:
      ANDROID_BUILD_DIR: /home/vagrant/build/com.matelsky.coppelia
      PUB_CACHE: /home/vagrant/build/com.matelsky.coppelia/.pub-cache
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Mirror checkout to F-Droid build path
        run: |
          sudo mkdir -p /home/vagrant/build
          sudo chown -R "$USER:$USER" /home/vagrant
          rm -rf "$ANDROID_BUILD_DIR"
          cp -a "$GITHUB_WORKSPACE" "$ANDROID_BUILD_DIR"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        working-directory: ${{ env.ANDROID_BUILD_DIR }}
        run: flutter pub get

      - name: Set up Android signing
        working-directory: ${{ env.ANDROID_BUILD_DIR }}
        env:
          ANDROID_UPLOAD_KEYSTORE: ${{ secrets.ANDROID_UPLOAD_KEYSTORE }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          test -n "$ANDROID_UPLOAD_KEYSTORE"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          printf '%s' "$ANDROID_UPLOAD_KEYSTORE" | base64 --decode > android/upload-keystore.jks
          cat > android/key.properties <<EOF
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF

      - name: Build Android armeabi-v7a APK
        working-directory: ${{ env.ANDROID_BUILD_DIR }}
        run: |
          flutter clean
          flutter pub get
          flutter build apk --release --split-per-abi --target-platform=android-arm

      - name: Package Android armeabi-v7a APK
        working-directory: ${{ env.ANDROID_BUILD_DIR }}
        run: cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk "$GITHUB_WORKSPACE/Coppelia-android-armeabi-v7a.apk"

      - name: Build Android arm64-v8a APK
        working-directory: ${{ env.ANDROID_BUILD_DIR }}
        run: |
          flutter clean
          flutter pub get
          flutter build apk --release --split-per-abi --target-platform=android-arm64

      - name: Package Android arm64-v8a APK
        working-directory: ${{ env.ANDROID_BUILD_DIR }}
        run: cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk "$GITHUB_WORKSPACE/Coppelia-android-arm64-v8a.apk"

      - name: Build Android x86_64 APK
        working-directory: ${{ env.ANDROID_BUILD_DIR }}
        run: |
          flutter clean
          flutter pub get
          flutter build apk --release --split-per-abi --target-platform=android-x64

      - name: Package Android x86_64 APK
        working-directory: ${{ env.ANDROID_BUILD_DIR }}
        run: cp build/app/outputs/flutter-apk/app-x86_64-release.apk "$GITHUB_WORKSPACE/Coppelia-android-x86_64.apk"

      - name: Build Android bundle
        working-directory: ${{ env.ANDROID_BUILD_DIR }}
        run: |
          flutter clean
          flutter pub get
          flutter build appbundle --release

      - name: Package Android bundle
        working-directory: ${{ env.ANDROID_BUILD_DIR }}
        run: cp build/app/outputs/bundle/release/app-release.aab "$GITHUB_WORKSPACE/Coppelia-android.aab"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Coppelia-android
          path: |
            Coppelia-android.aab
            Coppelia-android-armeabi-v7a.apk
            Coppelia-android-arm64-v8a.apk
            Coppelia-android-x86_64.apk

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            Coppelia-android.aab
            Coppelia-android-armeabi-v7a.apk
            Coppelia-android-arm64-v8a.apk
            Coppelia-android-x86_64.apk

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            appstream \
            clang \
            cmake \
            desktop-file-utils \
            libfuse2t64 \
            ninja-build \
            pkg-config \
            libgtk-3-dev \
            liblzma-dev \
            rpm

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Install Fastforge
        run: |
          dart pub global activate fastforge
          echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"

      - name: Install appimagetool
        run: |
          curl -sSL https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage -o /tmp/appimagetool
          chmod +x /tmp/appimagetool
          sudo mv /tmp/appimagetool /usr/local/bin/appimagetool

      - name: Build Linux bundle
        run: flutter build linux --release

      - name: Package bundle
        run: |
          tar -czf Coppelia-linux.tar.gz -C build/linux/x64/release/bundle .

      - name: Build Linux packages
        run: fastforge release --name dev

      - name: Create stable Linux release assets
        run: |
          appimage=$(find dist -type f -name '*.AppImage' -print -quit)
          deb=$(find dist -type f -name '*.deb' -print -quit)
          rpm=$(find dist -type f -name '*.rpm' -print -quit)
          test -n "$appimage" && test -n "$deb" && test -n "$rpm"
          cp "$appimage" Coppelia-linux.AppImage
          cp "$deb" Coppelia-linux.deb
          cp "$rpm" Coppelia-linux.rpm

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Coppelia-linux
          if-no-files-found: error
          path: |
            Coppelia-linux.tar.gz
            Coppelia-linux.AppImage
            Coppelia-linux.deb
            Coppelia-linux.rpm
            dist/**

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            Coppelia-linux.tar.gz
            Coppelia-linux.AppImage
            Coppelia-linux.deb
            Coppelia-linux.rpm
            dist/**
